name: Fastory Automated CI/CD Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-tauri-exe:
    name: Build & Release Windows App (.exe)
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          bun install

      - name: Install Root Dependencies
        run: bun install

      - name: Build Tauri Desktop (.exe & .msi) and Create GitHub Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: app-v__VERSION__
          releaseName: 'Fastory v__VERSION__'
          releaseBody: 'Automated release generated by GitHub Actions for Fastory Desktop & Web.'
          releaseDraft: false
          prerelease: false
          args: --target x86_64-pc-windows-msvc
