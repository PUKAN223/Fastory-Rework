services:
  caddy:
    image: caddy:2-alpine
    container_name: fastory-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:-inventory-project.ddns.net}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend

  postgres:
    image: postgres:16-alpine
    container_name: fastory-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: fastory
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastory"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    image: kisu221/fastory-backend:latest
    container_name: fastory-backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      DATABASE_URL: "postgresql://postgres:postgrespassword@postgres:5432/fastory?schema=public"
      DIRECT_URL: "postgresql://postgres:postgrespassword@postgres:5432/fastory?schema=public"
      NODE_ENV: production
      GEMINI_API_KEY: "${GEMINI_API_KEY:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI}"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: kisu221/fastory-web:latest
    container_name: fastory-web
    restart: always
    environment:
      PORT: 3000
      API_URL: "http://backend:8080"
      NEXT_PUBLIC_BASE_URL: "https://${DOMAIN:-inventory-project.ddns.net}"
    depends_on:
      - backend

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
