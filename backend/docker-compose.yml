services:
  db:
    image: postgres:16-alpine
    container_name: fastory-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: fastory
    ports:
      - "5432:5432"
    volumes:
      - fastory_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fastory"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  fastory_postgres_data:
